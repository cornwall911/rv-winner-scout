name: Daily RV Winner Scout

on:
  schedule:
    # Runs every day at 06:00 UTC (9:00 AM Egypt / Saudi time)
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Execution Mode (smoke for 30s test, full for complete crawl)'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - small
          - smoke

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore Checkpoint Database
        uses: actions/cache@v4
        with:
          path: data/checkpoint.db
          key: scout-checkpoint-${{ github.run_id }}
          restore-keys: |
            scout-checkpoint-

      - name: Run RV Winner Scout
        env:
          AI_PROVIDER: ${{ secrets.AI_PROVIDER || 'gemini' }}
          AI_MODEL: ${{ secrets.AI_MODEL || 'gemini-3.1-flash-lite' }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          TOKENROUTER_API_KEY: ${{ secrets.TOKENROUTER_API_KEY }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          SHEET_NAME: ${{ secrets.SHEET_NAME || 'Research Log' }}
          GOOGLE_SHEETS_CREDENTIALS_JSON: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MAX_PRODUCTS_PER_RUN: 10000
          GLOBAL_DEADLINE_MINUTES: 170
          SELECTED_MODE: ${{ inputs.mode || 'full' }}
        run: |
          python run.py --mode=${SELECTED_MODE}

      - name: Archive Reports
        if: always()
        run: |
          mkdir -p data/reports
        shell: bash

      - name: Upload Daily Reports Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-reports
          path: data/reports/
          retention-days: 14

      - name: Sync Public Dashboard to Main for Cloudflare
        if: always()
        run: |
          mkdir -p public
          if [ -f data/reports/index.html ]; then
            cp data/reports/index.html public/index.html
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/index.html
          git commit -m "Auto-update Cloudflare dashboard [skip ci]" || true
          git push origin main || true
