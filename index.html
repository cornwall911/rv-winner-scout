<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الموقع مغلق حالياً | Site Offline</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        body {
            background-color: #0b0f19;
            color: #f3f4f6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .container {
            max-width: 520px;
            width: 100%;
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 20px;
            padding: 48px 32px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .icon-wrapper {
            width: 80px;
            height: 80px;
            margin: 0 auto 24px;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
        }
        h1 {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 12px;
            color: #ffffff;
        }
        .subtitle {
            font-size: 15px;
            color: #9ca3af;
            line-height: 1.6;
            margin-bottom: 28px;
        }
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #1f2937;
            color: #ef4444;
            padding: 8px 18px;
            border-radius: 9999px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.5px;
            border: 1px solid #374151;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #ef4444;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 8px #ef4444;
        }
        .footer-note {
            margin-top: 36px;
            font-size: 12px;
            color: #4b5563;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon-wrapper">
            🔒
        </div>
        <h1>الموقع مغلق حالياً</h1>
        <p class="subtitle">
            تم إيقاف تشغيل المنصة مؤقتاً بأمر من الإدارة.<br>
            System is temporarily offline by administrator.
        </p>
        <div>
            <span class="badge">
                <span class="status-dot"></span>
                OFFLINE &bull; متوقف حالياً
            </span>
        </div>
        <p class="footer-note">
            RV Winner Scout &bull; Security & Maintenance Mode
        </p>
    </div>
</body>
</html>
